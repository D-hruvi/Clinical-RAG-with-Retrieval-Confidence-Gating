name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (catches syntax errors across the whole package)
        run: python -m py_compile $(find src -name "*.py")

      - name: Run guardrail unit tests (no API key required)
        run: pytest tests/ -v
